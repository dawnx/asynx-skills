name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check that the tag, the Skill and the plugin manifest name one version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          skill="$(python skills/asynx-image/scripts/asynx.py --version)"
          plugin="$(python -c 'import json; print(json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))["version"])')"
          echo "tag=$RELEASE_TAG skill=$skill plugin=$plugin"
          test "$RELEASE_TAG" = "v$skill"
          test "$skill" = "$plugin"
      - name: Test
        run: |
          python -m pip install "Pillow>=10.2,<13"
          python -m unittest discover -s tests -q
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes
